services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SQLITE_PATH: /data/marketing.db
      HTTP_ADDR: ":8080"
    volumes:
      - sqlite:/data
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_BASE: ${PUBLIC_BASE:-/}
    environment:
      BACKEND_URL: http://backend:8080
      PORT: "8080"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sqlite:
